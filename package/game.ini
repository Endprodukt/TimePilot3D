id           = timepilot3d
name         = Time Pilot 3D
manufacturer = Other
executable   = timepilot3d
version      = 0.73.0
sdk          = 0.1
author       = Oliver Carell (Endprodukt)
hiscores     = yes
marquee      = marquee.png

; Everything below can also be set on the machine, in the service menu: F2 or
; TAB. Closing it begins the game anew, from its title. Its SAVE writes
; save/settings.ini, and what stands there goes before what stands here. (An
; update of the game replaces this file, not that one.)

; --- the game ---------------------------------------------------------------

; The planes a game starts with, 1 to 9.
lives          = 3

; easy, normal, hard or ace: what a hit costs, how often and how fast the
; enemies shoot, how many there are, how readily they break away.
difficulty     = normal

; The score the first extra plane comes at; after it, one every 50000.
bonus_plane    = 10000

; How many enemies have to be shot down before an era's boss comes, 8 to 96.
; The original's 56 made an era last too long in the 3D sky.
enemies_per_era = 32

; The era a game begins in, 1 (1910) to 5 (2001): for trying things out.
start_era      = 1

; yes: START needs no coin.
free_play      = no

; Sound while nobody is playing (title, high scores, demo): yes or no.
attract_sound  = no

; --- the controls -----------------------------------------------------------

; What the game is flown with: yoke, or joystick (a stick with switches and
; four buttons; how to play then shows a stick and buttons).
control        = yoke

; The yoke: how far it turns the plane. 1.0 is the game's own rate, 2.0
; twice as sharp, 0.5 half. The dead zone around the middle, 0 to 50 percent.
yoke_sensitivity = 1.0
yoke_deadzone    = 12

; yes: pushing the yoke forward pulls the nose UP (the way a joystick game
; does it). no: pushing forward dives, as in an aircraft.
invert_pitch   = no

; The view a game starts in: cockpit (the cockpit round the head-up
; display, solid with SOLID OBJECTS), hud (the head-up display alone) or
; chase (behind and above the plane). START goes round them while a game
; is flown: hud, cockpit, chase. (An old cockpit_frame = no reads as hud.)
; The standard is hud.
view           = hud

; How much the guns help: 0 fires dead straight, 100 bends every shot onto
; the enemy nearest the gunsight, when it is within 6 degrees of it. A
; vector screen gives few depth cues.
aim_assist     = 40

; Which control does what, read directly (not through advmame.rc): key_ and
; the key's name (key_Left_Ctrl, key_Space), joy1_button3 (a joystick's
; button), yoke_button3 (the yoke's: a joystick whose name says "yoke"),
; joy1_hat1_up, joy1_axis2_neg, mouse_left. Several: + between them, up to
; four; none: no control. One control may be on several functions. The
; service menu (F2, TAB) lays them out by pressing them; the menus always go by
; their own controls (arrows, any stick or the yoke, START 1, Enter).
;
; The throttle rests in the middle. Faster and slower move it while they
; are held, and it drifts back when they are let go. The look back button
; shows what is behind the plane for as long as it is held.
fire_button    = key_Left_Ctrl+joy1_button1
faster_button  = key_Left_Alt+joy1_button2
slower_button  = key_Space+joy1_button3
rear_button    = key_Left_Shift+joy1_button4

; What opens the service menu besides F2 and TAB, which always do (F2 is the
; cabinet's key for every game's menu; neither is ever laid out).
menu_button    = key_F2

; Where the yoke's buttons are, by the number each reports: right trigger,
; left trigger, right thumb, left thumb. The yoke does not say; the service
; menu asks for them (CONTROLS, WHERE THE BUTTONS ARE). How to play needs it.
yoke_layout    = 1 2 3 4

; --- sound and picture ------------------------------------------------------

; How loud, each 0 to 100: everything, the effects, the engine.
volume         = 60
effects_volume = 80
engine_volume  = 40
music_volume   = 90

; How bright each kind of thing is drawn, 0 to 100 (below 15 the beam draws
; nothing, so 15 is the least): the ground and the buildings, the clouds,
; the enemies, the player's plane with its cockpit and head-up display, the
; shots, explosions and parachutes, the score line and the radar, the title
; lettering.
brightness_ground  = 45
brightness_clouds  = 40
brightness_enemies = 90
brightness_player  = 100
brightness_shots   = 100
brightness_effects = 80
brightness_text    = 70
brightness_title   = 100

; Solid things: yes, and what is behind a building, a plane or a boss (the
; ground, buildings, planes, shots) is not seen through it; no, and all of
; them are wire frames as everything is on a vector monitor.
occlusion          = yes

; A developer's aid, off as standard. Only while the debug level select is
; built in (DEBUG_LEVEL_SELECT): yes,
; START opens the choice of era and boss stage; no, START begins a game.
level_select       = no

; The last plane lost: yes, the picture stands and a countdown of ten
; seconds runs (any button but START hurries it); START (with a credit)
; flies on where the plane was lost, with the planes a game begins with and
; the score from 0. no: the game is over. Service menu: GAME, CONTINUE.
continue           = yes

; For testing: yes, and nothing harms the plane - hits, the ground,
; buildings and the time tunnel's wall are felt but cost nothing. The
; service menu has it under GAME, INVINCIBLE.
invincible         = no

; The first start's setup (how the cabinet is flown, its buttons) is not
; set here: it comes until it has been gone through once, and then
; save/settings.ini says setup_done = yes. The service menu (CONTROLS,
; CONTROL SETUP) begins it again; FACTORY RESET AND RESTART (its main page)
; deletes save/settings.ini and the high scores and begins with it.

; --- the monitor --------------------------------------------------------------
; How much of the board's range the picture fills, in percent (60..100). Less,
; if the monitor folds the picture over or cuts it off at an edge.
picture_size       = 100

; The beam travel a frame that counts as full load, in thousand board units
; (100..250). Lower, and the game thins out effects, ground and sky sooner:
; for a monitor whose picture shrinks when much is drawn.
beam_limit         = 250
